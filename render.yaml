services:
  - type: web
    runtime: node
    name: vairtex-crm-api
    plan: starter
    rootDir: .
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vairtex-crm-db
          property: connectionString
      - key: PORT
        value: 3000
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: AUTH_SECRET
        generateValue: true

  - type: web
    runtime: static
    name: vairtex-crm-frontend
    rootDir: crm-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_BASE_URL
        sync: false

databases:
  - name: vairtex-crm-db
    databaseName: crm
    user: crm_admin
    plan: free
